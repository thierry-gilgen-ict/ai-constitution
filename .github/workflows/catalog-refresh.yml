name: Preview catalog refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch definitions without changing preferred routes
        run: python scripts/constitution.py --state-dir .local update --source-checkout
      - name: Validate the updated snapshot
        run: python scripts/constitution.py check
      - name: Produce reviewable patch
        if: always()
        run: git diff --binary > catalog-update.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: catalog-update
          path: |
            catalog-update.patch
            .local/catalog-diff.json
          include-hidden-files: true
          retention-days: 7
