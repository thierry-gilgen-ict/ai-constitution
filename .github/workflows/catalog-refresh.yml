name: Preview catalog refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch definitions without changing preferred routes
        run: python scripts/constitution.py --state-dir .local update --source-checkout
      - name: Validate the updated snapshot
        run: python scripts/constitution.py check
      - name: Produce reviewable patch
        if: always()
        run: git diff --binary > catalog-update.patch
      - id: publication
        if: always()
        uses: ./.github/actions/scan-publication
        with:
          paths: |
            catalog-update.patch
            .local/catalog-diff.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.publication.outcome == 'success'
        with:
          name: catalog-update
          path: |
            catalog-update.patch
            .local/catalog-diff.json
          include-hidden-files: true
          retention-days: 7
