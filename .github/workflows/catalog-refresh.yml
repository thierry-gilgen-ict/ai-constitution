name: Preview catalog refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Fetch definitions without changing preferred routes
        run: python scripts/constitution.py --state-dir .local update
      - name: Validate the updated snapshot
        run: python scripts/constitution.py check
      - name: Produce reviewable patch
        if: always()
        run: git diff --binary > catalog-update.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catalog-update
          path: |
            catalog-update.patch
            .local/catalog-diff.json
          include-hidden-files: true
          retention-days: 7
