name: Package Local Control preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local_control/**'
      - 'packaging/**'
      - 'scripts/local_control.py'
      - 'scripts/package_local.py'
      - 'scripts/releases.py'
      - 'scripts/release_inventory.py'
      - 'scripts/scan_publication.py'
      - 'checks/release-files.json'
      - '.github/actions/scan-publication/**'
      - 'scripts/sign_package.py'
      - 'scripts/smoke_local_package.py'
      - 'scripts/constitution.py'
      - 'scripts/architecture.py'
      - 'templates/**'
      - 'requirements-*.txt'
      - '.github/workflows/package-preview.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/package_local.py --output .local/package
      - uses: ./.github/actions/scan-publication
        with:
          paths: .local/package/public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-control-preview-${{ runner.os }}-${{ runner.arch }}
          path: .local/package/public
          retention-days: 7
