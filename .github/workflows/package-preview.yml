name: Package Local Control preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local_control/**'
      - 'packaging/**'
      - 'scripts/local_control.py'
      - 'scripts/package_local.py'
      - 'requirements-*.txt'
      - '.github/workflows/package-preview.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/package_local.py --output .local/package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-control-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            .local/package/app
            .local/package/licenses
            .local/package/dependencies.json
            .local/package/manifest.json
          include-hidden-files: true
          retention-days: 7
