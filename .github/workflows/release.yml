name: Verified release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version already committed to VERSION on main
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify release identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os,re,pathlib; v=os.environ['REQUESTED_VERSION']; assert re.fullmatch(r'\d+\.\d+\.\d+',v); assert pathlib.Path('VERSION').read_text().strip()==v; assert os.environ['GITHUB_REF']=='refs/heads/main'"
      - run: python -m pip install -r requirements-local-node.txt
      - run: python scripts/constitution.py check
      - run: python scripts/release_inventory.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/constitution.py scan
      - run: python scripts/check_docs.py
      - run: python scripts/check_screenshots.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      # Publisher identities are optional; see docs/releasing.md. Builds without
      # configured identities remain explicitly unsigned in their manifests.
      - run: python scripts/package_local.py --output .local/package
      - uses: ./.github/actions/scan-publication
        with:
          paths: .local/package/public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: .local/package/public
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: .local/release
      - run: python scripts/assemble_release.py --output .local/release
      - uses: ./.github/actions/scan-publication
        with:
          paths: .local/release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .local/release/*
      - name: Publish complete verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" .local/release/* --target "$GITHUB_SHA" --title "AI Constitution ${RELEASE_VERSION}" --notes-file docs/release-notes.md --draft
          gh release edit "v${RELEASE_VERSION}" --draft=false --latest
