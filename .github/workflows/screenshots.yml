name: Documentation screenshots
on:
  push:
  pull_request:
# Cancel superseded checks for the same event/ref; never cancel release publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Verify committed documentation
        run: |
          python scripts/check_screenshots.py
          python scripts/check_docs.py
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture every documented workflow without touching live state
        run: node scripts/screenshots.cjs --output .local/screenshot-comparison
      - id: publication
        if: always()
        uses: ./.github/actions/scan-publication
        with:
          paths: |
            .local/screenshot-comparison
            docs/assets/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.publication.outcome == 'success'
        with:
          name: documentation-screenshot-review
          path: |
            .local/screenshot-comparison
            docs/assets/screenshots
          include-hidden-files: true
          retention-days: 14
